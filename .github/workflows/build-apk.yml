name: Build and Release Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Accept Android SDK Licenses & Install SDK 35
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

    - name: Install Dependencies & Sync Capacitor
      run: |
        npm ci || npm install
        node scripts/generateCapacitorIcons.js
        npx cap sync android

    - name: Build APK with Gradle Wrapper
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle.log || (echo "=== GRADLE FAILURE LOG ==="; tail -n 80 gradle.log; exit 1)
        cp app/build/outputs/apk/debug/app-debug.apk ../AC.apk

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-failure-log
        path: android/gradle.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AC-Capacitor-debug
        path: AC.apk

    - name: Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "AC Mobile App v1.0.0 (Capacitor)"
        body: |
          ### AC Mobile Financial Management App
          - **Powered by Capacitor 7**
          - App Name: **AC**
          - Custom Branded App Icon (AC Royal Blue & Cyan)
          - Parent Company: **AmozTech**
          - Owner: **Amos**
          - 100% Offline Separate Entity Accounting Engine
        files: AC.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
