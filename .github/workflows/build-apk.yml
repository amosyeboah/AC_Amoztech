name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug --stacktrace --no-daemon
        cp app/build/outputs/apk/debug/app-debug.apk ../AC.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AC-debug-app
        path: AC.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "AC Mobile App v1.0.0"
        body: |
          ### AC Mobile Financial Management App
          - Parent Company: **AmozTech**
          - Owner: **Amos**
          - 100% Standalone & Offline Native Android APK
          - Separate Entity Concept & Double-Entry Ledger
          - Wakanow Mobile Visual Design
        files: AC.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
